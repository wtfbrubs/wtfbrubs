  <text x="470" y="236" font-size="7" fill="#1E4060" letter-spacing="0.1em">DEV</text>
  <text x="552" y="236" font-size="7.5" fill="#4A7890">Go  ·  React</text>

  <!-- Rule before certs -->
  <line x1="460" y1="251" x2="880" y2="251" stroke="#0D2235" stroke-width="0.5"/>

  <text x="460" y="266" font-size="7" fill="#1A4060" letter-spacing="0.14em">// CERTIFICATIONS</text>

  <!-- Cert 1: AWS SAA -->
  <rect x="460" y="275" width="420" height="28" rx="3" fill="#070C18" stroke="#0D2235" stroke-width="0.75"/>
  <rect x="460" y="275" width="3" height="28" rx="1" fill="#FF9900" opacity="0.8"/>
  <text x="472" y="288" font-size="7.5" fill="#B08030" font-weight="600">AWS Solutions Architect – Associate</text>
  <text x="472" y="299" font-size="6.5" fill="#1E4060">Amazon Web Services</text>

  <!-- Cert 2: AWS CCP -->
  <rect x="460" y="309" width="420" height="28" rx="3" fill="#070C18" stroke="#0D2235" stroke-width="0.75"/>
  <rect x="460" y="309" width="3" height="28" rx="1" fill="#FF9900" opacity="0.8"/>
  <text x="472" y="322" font-size="7.5" fill="#B08030" font-weight="600">AWS Cloud Practitioner</text>
  <text x="472" y="333" font-size="6.5" fill="#1E4060">Amazon Web Services</text>

  <!-- Cert 3: OCI Architect -->
  <rect x="460" y="343" width="206" height="28" rx="3" fill="#070C18" stroke="#0D2235" stroke-width="0.75"/>
  <rect x="460" y="343" width="3" height="28" rx="1" fill="#F80000" opacity="0.7"/>
  <text x="472" y="356" font-size="7.5" fill="#A05050" font-weight="600">OCI Architect Associate</text>
  <text x="472" y="367" font-size="6.5" fill="#1E4060">Oracle Cloud Infrastructure</text>

  <!-- Cert 4: Scrum -->
  <rect x="672" y="343" width="208" height="28" rx="3" fill="#070C18" stroke="#0D2235" stroke-width="0.75"/>
  <rect x="672" y="343" width="3" height="28" rx="1" fill="#00897B" opacity="0.8"/>
  <text x="684" y="356" font-size="7.5" fill="#208070" font-weight="600">Scrum Foundation (SFPC)</text>
  <text x="684" y="367" font-size="6.5" fill="#1E4060">CertiProf</text>

</svg>
