  <!-- Top glow accent line -->
  <rect width="900" height="1.5" fill="url(#g-top)" clip-path="url(#clip)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

