<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" style="font-family:'IBM Plex Mono','Courier New',monospace">
  <defs>
    <pattern id="grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,140,210,0.06)" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="g-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#00C8FF" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#F5A623" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="420" rx="10"/></clipPath>
  </defs>

  <!-- Base -->
  <rect width="900" height="420" rx="10" fill="#060E1A" clip-path="url(#clip)"/>
  <rect width="900" height="420" fill="url(#grid)" clip-path="url(#clip)"/>

  <!-- Animated top line -->
  <rect width="900" height="1.5" fill="url(#g-top)" clip-path="url(#clip)">
    <animate attributeName="opacity" values="0.4;0.95;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Outer border -->
  <rect width="900" height="420" rx="10" fill="none" stroke="#0D2235" stroke-width="1"/>

  <!-- Blueprint corner marks -->
  <path d="M 12 26 L 12 10 L 28 10" fill="none" stroke="#00C8FF" stroke-width="1" opacity="0.35"/>
  <path d="M 888 26 L 888 10 L 872 10" fill="none" stroke="#00C8FF" stroke-width="1" opacity="0.35"/>
  <path d="M 12 394 L 12 410 L 28 410" fill="none" stroke="#00C8FF" stroke-width="1" opacity="0.35"/>
  <path d="M 888 394 L 888 410 L 872 410" fill="none" stroke="#00C8FF" stroke-width="1" opacity="0.35"/>

  <!-- Header -->
  <rect width="900" height="44" fill="#07111D" clip-path="url(#clip)"/>
  <rect y="43" width="900" height="1" fill="#0D2235"/>

  <!-- Status pulse -->
  <circle cx="30" cy="22" r="9" fill="#00C8FF" opacity="0.07">
    <animate attributeName="r" values="4;11;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="22" r="3.5" fill="#00C8FF" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="27" font-size="11" fill="#C0DCF0" font-weight="700" letter-spacing="0.1em">BRUNO DE LIMA</text>
  <text x="48" y="38" font-size="7" fill="#1A3D5A" letter-spacing="0.14em">CLOUD &amp; DEVOPS ENGINEER  ·  MULTI-CLOUD PLATFORM  ·  14+ YRS</text>

  <!-- Window dots -->
  <circle cx="852" cy="22" r="5" fill="#FF5F57"/>
  <circle cx="868" cy="22" r="5" fill="#FEBC2E"/>
  <circle cx="884" cy="22" r="5" fill="#28C840"/>

  <!-- Column separator -->
  <rect x="440" y="44" width="1" height="376" fill="#0D2235"/>

  <!-- ══════════════ LEFT COLUMN ══════════════ -->

  <text x="20" y="61" font-size="7" fill="#1A4060" letter-spacing="0.14em">// FIELD REPORT</text>

  <!-- Row 1: EXPERIENCE (shaded) -->
  <rect x="20" y="68" width="412" height="28" rx="2" fill="#070C18"/>
  <text x="30" y="86" font-size="7" fill="#20486A" letter-spacing="0.1em">EXPERIENCE</text>
  <line x1="128" y1="82" x2="358" y2="82" stroke="#0D2235" stroke-width="0.5" stroke-dasharray="2,4"/>
  <text x="416" y="86" font-size="9.5" fill="#00C8FF" font-weight="600" text-anchor="end">14+ YRS</text>

  <!-- Row 2: PROJECTS (clear) -->
  <text x="30" y="118" font-size="7" fill="#20486A" letter-spacing="0.1em">PROJETOS ENTREGUES</text>
  <line x1="210" y1="114" x2="358" y2="114" stroke="#0D2235" stroke-width="0.5" stroke-dasharray="2,4"/>
  <text x="416" y="118" font-size="9.5" fill="#F5A623" font-weight="600" text-anchor="end">70+</text>

  <!-- Row 3: CLOUD PROVIDERS (shaded) -->
  <rect x="20" y="130" width="412" height="28" rx="2" fill="#070C18"/>
  <text x="30" y="148" font-size="7" fill="#20486A" letter-spacing="0.1em">CLOUD PROVIDERS</text>
  <line x1="176" y1="144" x2="358" y2="144" stroke="#0D2235" stroke-width="0.5" stroke-dasharray="2,4"/>
  <text x="416" y="148" font-size="9.5" fill="#00C8FF" font-weight="600" text-anchor="end">04</text>

  <!-- Row 4: SLA TARGET (clear) -->
  <text x="30" y="180" font-size="7" fill="#20486A" letter-spacing="0.1em">SLA TARGET</text>
  <line x1="118" y1="176" x2="348" y2="176" stroke="#0D2235" stroke-width="0.5" stroke-dasharray="2,4"/>
  <text x="416" y="180" font-size="9.5" fill="#00C8FF" font-weight="600" text-anchor="end">99.9 %</text>

  <!-- Thin rule -->
  <line x1="20" y1="200" x2="430" y2="200" stroke="#0D2235" stroke-width="0.5"/>

  <text x="20" y="218" font-size="7" fill="#1A4060" letter-spacing="0.14em">// HIGHLIGHTS</text>

  <text x="20" y="234" font-size="7.5" fill="#1A5278">▸</text>
  <text x="34" y="234" font-size="7.5" fill="#4A7890">OKE platform engineering  ·  EKS  ·  AKS  ·  GitOps</text>

  <text x="20" y="254" font-size="7.5" fill="#B07820">▸</text>
  <text x="34" y="254" font-size="7.5" fill="#4A7890">FinOps governance  ·  ISO 27001  ·  RCA ownership</text>

  <text x="20" y="274" font-size="7.5" fill="#1A5278">▸</text>
  <text x="34" y="274" font-size="7.5" fill="#4A7890">VPN IPSec site-to-site  ·  Keycloak SSO  ·  KMS</text>

  <text x="20" y="294" font-size="7.5" fill="#B07820">▸</text>
  <text x="34" y="294" font-size="7.5" fill="#4A7890">Go + React  ·  consultoria multi-cliente  ·  24/7 ops</text>

  <!-- Rule -->
  <line x1="20" y1="314" x2="430" y2="314" stroke="#0D2235" stroke-width="0.5"/>

  <text x="20" y="332" font-size="7" fill="#1A4060" letter-spacing="0.14em">// CURRENTLY</text>

  <text x="20" y="348" font-size="7.5" fill="#F5A623" opacity="0.7">→</text>
  <text x="32" y="348" font-size="7.5" fill="#4A7890">Platform engineering on OKE  ·  Oracle Cloud (multi-env)</text>

  <text x="20" y="364" font-size="7.5" fill="#F5A623" opacity="0.7">→</text>
  <text x="32" y="364" font-size="7.5" fill="#4A7890">Building internal tooling in Go + React</text>

  <!-- Status bar -->
  <rect x="20" y="387" width="410" height="22" rx="3" fill="#070C18" stroke="#0D2235" stroke-width="0.75"/>
  <circle cx="34" cy="398" r="2.5" fill="#00C8FF">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="402" font-size="7" fill="#1E4A6A">ONLINE  ·  Ponta Grossa, PR  ·  Brazil</text>
  <text x="420" y="402" font-size="7" fill="#122030" text-anchor="end">github.com/wtfbrubs</text>

  <!-- ══════════════ RIGHT COLUMN ══════════════ -->

  <text x="460" y="61" font-size="7" fill="#1A4060" letter-spacing="0.14em">// STACK INVENTORY</text>

  <!-- Vertical rule: category | items -->
  <line x1="542" y1="65" x2="542" y2="246" stroke="#0D2235" stroke-width="0.5"/>

  <!-- CLOUD (shaded) -->
  <rect x="460" y="68" width="420" height="20" rx="2" fill="#070C18"/>
  <text x="470" y="82" font-size="7" fill="#1E4060" letter-spacing="0.1em">CLOUD</text>
  <text x="552" y="82" font-size="7.5" fill="#4A7890">OCI  ·  AWS  ·  Azure  ·  GCP</text>

  <!-- CONTAINERS -->
  <text x="470" y="104" font-size="7" fill="#1E4060" letter-spacing="0.1em">CONTAINERS</text>
  <text x="552" y="104" font-size="7.5" fill="#4A7890">Kubernetes  ·  Docker  ·  Rancher</text>

  <!-- IaC (shaded) -->
  <rect x="460" y="112" width="420" height="20" rx="2" fill="#070C18"/>
  <text x="470" y="126" font-size="7" fill="#1E4060" letter-spacing="0.1em">IaC</text>
  <text x="552" y="126" font-size="7.5" fill="#4A7890">Terraform  ·  Ansible  ·  Bash</text>

