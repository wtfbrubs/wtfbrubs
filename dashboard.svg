  <text x="552" y="148" font-size="7.5" fill="#4A7890">GitHub Actions  ·  GitLab CI  ·  ArgoCD  ·  Azure DevOps</text>

  <!-- NET/SEC (shaded) -->
  <rect x="460" y="156" width="420" height="20" rx="2" fill="#070C18"/>
  <text x="470" y="170" font-size="7" fill="#1E4060" letter-spacing="0.1em">NET/SEC</text>
  <text x="552" y="170" font-size="7.5" fill="#4A7890">Nginx  ·  Cloudflare  ·  OpenVPN  ·  Keycloak</text>

  <!-- OBSERVABILITY -->
  <text x="470" y="192" font-size="7" fill="#1E4060" letter-spacing="0.1em">OBSERVABILITY</text>
  <text x="552" y="192" font-size="7.5" fill="#4A7890">Grafana  ·  Prometheus  ·  Zabbix</text>

  <!-- DATABASES (shaded) -->
  <rect x="460" y="200" width="420" height="20" rx="2" fill="#070C18"/>
  <text x="470" y="214" font-size="7" fill="#1E4060" letter-spacing="0.1em">DATABASES</text>
  <text x="552" y="214" font-size="7.5" fill="#4A7890">MySQL  ·  Oracle  ·  PostgreSQL  ·  Redis</text>

