<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" style="font-family:'IBM Plex Mono','Courier New',monospace">
  <defs>
    <pattern id="dot" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF6A"/>
      <stop offset="100%" stop-color="#00CC55"/>
    </linearGradient>
    <linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C400"/>
      <stop offset="100%" stop-color="#D4A800"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="g-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF6A" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#00FF6A" stop-opacity="0"/>
      <stop offset="70%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="420" rx="10"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="10" fill="#0D0F12" clip-path="url(#clip)"/>
